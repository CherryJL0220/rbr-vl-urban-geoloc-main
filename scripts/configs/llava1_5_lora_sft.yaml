### model
model_name_or_path: llava1_5-7b
visual_inputs: true

### method
stage: sft
do_train: true
finetuning_type: lora
lora_target: all

### dataset
dataset: pitts  # video: mllm_video_demo
template: llava
cutoff_len: 1024
max_samples: 100
overwrite_cache: true
preprocessing_num_workers: 16
tokenized_path: /root/autodl-tmp/dataset/tokenized_path/pitts/pitts_train_ratio

### output
output_dir: /root/autodl-tmp/save_checkpoint/llava1_5-7b/pitts_train_ratio
logging_steps: 10
save_steps: 500
plot_loss: true
overwrite_output_dir: true

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 1.0e-4
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000
swft_loss_weight: 1.0
img_addr_loss_weight: 0.9
img_desc_loss_weight: 0.1
# img_output_loss_weight: 0.1
contrastive_temperature: 0.07  

